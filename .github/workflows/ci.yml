name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Both jobs check out the Atom-DSP, Atom-SignalLab, Atom-Classifier, and
  # Atom-Firmware siblings. Atom-Firmware is required because the
  # trio-composition tests prove the manifest byte-identical across all three
  # composition repositories by reading each sibling's contracts/ from disk.
  # All are public, so the default GITHUB_TOKEN covers the checkouts and no PAT
  # or gate job is needed (a prior ATOMOS_CLASSIFIER_READ_TOKEN gate silently
  # skipped every run of this workflow from when Atom-Classifier went public
  # until this comment).
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Atom-Atomizer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: Atom-Atomizer
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: PhysicistJohn/Atom-DSP
          ref: v0.2.0
          path: Atom-DSP
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: PhysicistJohn/Atom-SignalLab
          ref: deae7214a1d7b74b4327983362e97d754c9736a6
          path: Atom-SignalLab
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: PhysicistJohn/Atom-Classifier
          ref: c2f872fe8157cec4add34e2a7b5e01e186203573
          path: Atom-Classifier
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: PhysicistJohn/Atom-Firmware
          ref: 2cf54b11f52848e4f21ce0b17b77d887196f102c
          path: Atom-Firmware
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            Atom-DSP/package-lock.json
            Atom-Atomizer/package-lock.json
            Atom-SignalLab/package-lock.json
            Atom-Classifier/package-lock.json
      - name: Install exact npm
        run: npm install --global npm@10.9.8
      - name: Verify exact Node and npm versions
        shell: bash
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "10.9.8"
      - name: Build Atom-DSP
        working-directory: Atom-DSP
        run: npm ci && npm run build
      - name: Install Classifier dependencies
        working-directory: Atom-Classifier
        run: npm ci --ignore-scripts
      - name: Install SignalLab dependencies
        working-directory: Atom-SignalLab
        # NOT --omit=dev: apps/desktop's typecheck compiles SignalLab's .tsx
        # source directly (cross-repo import), which needs @types/react -- a
        # SignalLab devDependency.
        run: npm ci --ignore-scripts
      - name: Install Atomizer
        run: npm ci
      - run: npm run check:launcher
      - name: Build (workspace packages first)
        # apps/desktop imports the other @tinysa/* workspace packages as
        # built output (their package.json "types"/"exports" point at dist/),
        # so typecheck must run after this, not before.
        run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit

  signal-lab-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SIGNAL_LAB_INTEGRATION_REQUIRED: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: Atom-Atomizer
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: PhysicistJohn/Atom-DSP
          ref: v0.2.0
          path: Atom-DSP
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: PhysicistJohn/Atom-SignalLab
          ref: deae7214a1d7b74b4327983362e97d754c9736a6
          path: Atom-SignalLab
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: PhysicistJohn/Atom-Classifier
          ref: c2f872fe8157cec4add34e2a7b5e01e186203573
          path: Atom-Classifier
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: PhysicistJohn/Atom-Firmware
          ref: 2cf54b11f52848e4f21ce0b17b77d887196f102c
          path: Atom-Firmware
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            Atom-DSP/package-lock.json
            Atom-Atomizer/package-lock.json
            Atom-SignalLab/package-lock.json
            Atom-Classifier/package-lock.json
      - name: Install exact npm
        run: npm install --global npm@10.9.8
      - name: Verify exact Node and npm versions
        shell: bash
        run: |
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "10.9.8"
      - name: Build Atom-DSP
        working-directory: Atom-DSP
        run: npm ci && npm run build
      - name: Install Classifier dependencies
        working-directory: Atom-Classifier
        run: npm ci --ignore-scripts
      - name: Install SignalLab
        working-directory: Atom-SignalLab
        run: npm ci
      - name: Verify SignalLab
        working-directory: Atom-SignalLab
        run: npm run check
      - name: Install Atomizer
        working-directory: Atom-Atomizer
        run: npm ci
      - name: Ensure the Electron binary actually landed
        working-directory: Atom-Atomizer
        shell: bash
        # SignalLab's own npm ci (just above) already primed Electron's shared download
        # cache -- Atomizer's npm ci then extracts from that warm cache
        # instead of downloading, which can silently leave the desktop
        # workspace's electron/dist empty on this job. Self-heal by forcing
        # Electron's own postinstall to run again, with diagnostics if it
        # still doesn't land.
        #
        # Resolve the binary the way Electron itself does, through the path.txt
        # its postinstall writes, rather than hardcoding a name. That file holds
        # `electron` on Linux, `Electron.app/Contents/MacOS/Electron` on macOS,
        # and `electron.exe` on Windows, and this job runs on macOS.
        run: |
          root=apps/desktop/node_modules/electron
          if [ ! -f "$root/path.txt" ] || [ ! -e "$root/dist/$(cat "$root/path.txt")" ]; then
            echo "Electron binary missing after npm ci; forcing its install script"
            ls -la "$root/dist" 2>&1 || echo "$root/dist does not exist"
            node "$root/install.js"
          fi
          test -f "$root/path.txt"
          binary="$root/dist/$(cat "$root/path.txt")"
          echo "resolved Electron binary: $binary"
          test -e "$binary"
      - name: Validate the Bayesian detector
        working-directory: Atom-Atomizer
        run: npm run check:bayesian-detector
      - name: Require real in-process SignalLab interoperability
        working-directory: Atom-Atomizer
        run: npm run check
